        type: string
    type: object
  messagesResponse:
    properties:
      has_more:
        type: boolean
      messages:
        items:
          $ref: '#/definitions/messageResponse'
        type: array
    type: object
  musicListResponse:
    properties:
      tracks:
        items:
          $ref: '#/definitions/musicResponse'
        type: array
    type: object
  musicResponse:
    properties:
      artist:
        type: string
      created_at:
        type: string
      duration:
        type: number
      id:
        type: string
      media_id:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  permissionsResponse:
    properties:
      permissions:
        items:
          type: string
        type: array
    type: object
  photoAlbumPayload:
    properties:
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      photos:
        items:
          $ref: '#/definitions/photoPayload'
        type: array
      title:
        type: string
    type: object
  photoAlbumRequest:
    properties:
      title:
        type: string
    type: object
  photoAlbumResponse:
    properties:
      album:
        $ref: '#/definitions/photoAlbumPayload'
    type: object
  photoPayload:
    properties:
      album_id:
        type: string
      caption:
        type: string
      created_at:
        type: string
      id:
        type: string
      media_id:
        type: string
      photo_url:
        type: string
    type: object
  postRequest:
    properties:
      body:
        type: string
      media_ids:
        items:
          type: string
        type: array
    type: object
  postResponse:
    properties:
      author_id:
        type: string
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      media_ids:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  postsResponse:
    properties:
      posts:
        items:
          $ref: '#/definitions/postResponse'
        type: array
    type: object
  presenceResponse:
    properties:
      online:
        type: boolean
      user_id:
        type: string
    type: object
  profilePhotosResponse:
    properties:
      albums:
        items:
          $ref: '#/definitions/photoAlbumPayload'
        type: array
      is_own_profile:
        type: boolean
      owner_id:
        type: string
    type: object
  profileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      handle:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  profilesResponse:
    properties:
      profiles:
        items:
          $ref: '#/definitions/profileResponse'
        type: array
    type: object
  recommendationResponse:
    properties:
      common_friends:
        type: integer
      user_id:
        type: string
    type: object
  recommendationsResponse:
    properties:
      recommendations:
        items:
          $ref: '#/definitions/recommendationResponse'
        type: array
    type: object
  refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  registerRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  relationshipsResponse:
    properties:
      friends:
        items:
          type: string
        type: array
      subscribers:
        items:
          type: string
        type: array
      subscriptions:
        items:
          type: string
        type: array
    type: object
  renditionResponse:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      duration:
        type: number
      height:
        type: integer
      id:
        type: string
      size:
        type: integer
    type: object
  resetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  setHandleRequest:
    properties:
      handle:
        type: string
    type: object
  tokenRequest:
    properties:
      token:
        type: string
    type: object
  updateProfileRequest:
    properties:
      bio:
        type: string
      display_name:
        type: string
    type: object
  userResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_seen_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  videoAlbumListItem:
    properties:
      id:
        type: string
      title:
        type: string
      videos:
        items:
          $ref: '#/definitions/videoResponse'
        type: array
    type: object
  videoAlbumListResponse:
    properties:
      albums:
        items:
          $ref: '#/definitions/videoAlbumListItem'
        type: array
    type: object
  videoAlbumResponse:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  videoFlagResponse:
    properties:
      bookmarked:
        type: boolean
      favorited:
        type: boolean
    type: object
  videoLikeResponse:
    properties:
      liked:
        type: boolean
      likes_count:
        type: integer
    type: object
  videoResponse:
    properties:
      album_id:
        type: string
      created_at:
        type: string
      duration:
        type: number
      id:
        type: string
      is_bookmarked_by_current:
        type: boolean
      is_favorited_by_current:
        type: boolean
      is_liked_by_current:
        type: boolean
      likes_count:
        type: integer
      media_id:
        type: string
      original_filename:
        type: string
      owner_id:
        type: string
      renditions:
        items:
          $ref: '#/definitions/renditionResponse'
        type: array
      status:
        type: string
      title:
        type: string
      updated_at:
