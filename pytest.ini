[pytest]
pythonpath = .
addopts = -p no:warnings -v
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
env_files =
    .test.env

norecursedirs = redis-data
markers =
    unit: isolated test without database or external services
    integration: test involving database, application wiring, or external adapters
    slow: test that is expected to take noticeably longer
    domain: test of domain entities and policies
    application: test of application services and use cases
