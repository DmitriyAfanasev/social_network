services:
  pg:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"

  pg_test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: test_database
      POSTGRES_USER: test_admin
      POSTGRES_PASSWORD: test_password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    init: true
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      profiles:
        condition: service_started
      social:
        condition: service_started
      content:
        condition: service_started
      media:
        condition: service_started
      messaging:
        condition: service_started
      call-signaling:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GATEWAY_HTTP_ADDR: ":8000"
      GATEWAY_REDIS_ADDR: redis:6379
      GATEWAY_IDENTITY_URL: http://identity:8101
      GATEWAY_PROFILES_URL: http://profiles:8102
      GATEWAY_SOCIAL_URL: http://social:8103
      GATEWAY_CONTENT_URL: http://content:8104
      GATEWAY_MEDIA_URL: http://media:8105
      GATEWAY_MESSAGING_URL: http://messaging:8106
      GATEWAY_CALLS_URL: http://call-signaling:8001
      GATEWAY_ALLOWED_ORIGINS: "${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      GATEWAY_RATE_LIMIT: "600"
      GATEWAY_RATE_LIMIT_WINDOW: 1m
      GATEWAY_READINESS_TIMEOUT: 2s

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      IDENTITY_HTTP_ADDR: ":8101"
      IDENTITY_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      IDENTITY_REDIS_ADDR: redis:6379
      IDENTITY_JWT_SECRET: "${IDENTITY_JWT_SECRET:-local-identity-secret}"
      IDENTITY_SMTP_ADDR: mailpit:1025
      IDENTITY_SMTP_FROM: "${IDENTITY_SMTP_FROM:-noreply@localhost}"
      IDENTITY_FRONTEND_BASE_URL: "${IDENTITY_FRONTEND_BASE_URL:-http://localhost:5173}"
      IDENTITY_ACCESS_TTL: "1800"
      IDENTITY_REFRESH_TTL: "604800"

  profiles:
    build:
      context: .
      dockerfile: services/profiles/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8102:8102"
    environment:
      PROFILES_HTTP_ADDR: ":8102"
      PROFILES_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      PROFILES_REDIS_ADDR: redis:6379
      PROFILES_JWT_SECRET: "${IDENTITY_JWT_SECRET:-local-identity-secret}"

  social:
    build:
      context: .
      dockerfile: services/social/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8103:8103"
    environment:
      SOCIAL_HTTP_ADDR: ":8103"
      SOCIAL_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      SOCIAL_REDIS_ADDR: redis:6379
      SOCIAL_JWT_SECRET: "${IDENTITY_JWT_SECRET:-local-identity-secret}"
      SOCIAL_KAFKA_BROKERS: kafka:29092
      SOCIAL_EVENTS_TOPIC: application.events

  content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8104:8104"
    environment:
      CONTENT_HTTP_ADDR: ":8104"
      CONTENT_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      CONTENT_REDIS_ADDR: redis:6379
      CONTENT_MEDIA_ADDR: http://media:8105
      CONTENT_JWT_SECRET: "${IDENTITY_JWT_SECRET:-local-identity-secret}"
      CONTENT_KAFKA_BROKERS: kafka:29092
      CONTENT_EVENTS_TOPIC: application.events

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:8105:8105"
    environment:
      MEDIA_HTTP_ADDR: ":8105"
      MEDIA_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      MEDIA_REDIS_ADDR: redis:6379
      MEDIA_KAFKA_BROKERS: kafka:29092
      MEDIA_KAFKA_GROUP_ID: media-video-completions
      MEDIA_EVENTS_TOPIC: application.events
      MEDIA_JWT_SECRET: "${IDENTITY_JWT_SECRET:-local-identity-secret}"
      MEDIA_S3_ENDPOINT: minio:9000
      MEDIA_S3_BUCKET: general-project
      MEDIA_S3_ACCESS_KEY: minioadmin
      MEDIA_S3_SECRET_KEY: minioadmin
      MEDIA_S3_SECURE: "false"

  messaging:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8106:8106"
    environment:
      MESSAGING_HTTP_ADDR: ":8106"
      MESSAGING_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      MESSAGING_REDIS_ADDR: redis:6379
      MESSAGING_JWT_SECRET: "${IDENTITY_JWT_SECRET:-local-identity-secret}"
      MESSAGING_REALTIME_INFLIGHT_LIMIT: "1024"
      MESSAGING_KAFKA_BROKERS: kafka:29092
      MESSAGING_EVENTS_TOPIC: application.events
      MESSAGING_NOTIFICATION_CONSUMER_GROUP: messaging-notifications
      MESSAGING_KAFKA_MAX_BYTES: "10000000"

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      ANALYTICS_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      ANALYTICS_KAFKA_BROKERS: kafka:29092
      ANALYTICS_EVENTS_TOPIC: application.events
      ANALYTICS_CONSUMER_GROUP: analytics-read-model
      ANALYTICS_POLL_INTERVAL: 1s
      ANALYTICS_DLQ_TOPIC: analytics.dlq
      ANALYTICS_MAX_ATTEMPTS: "3"
      ANALYTICS_RETRY_BASE: 1s

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      ADMIN_DATABASE_URL: postgres://admin:password@pg:5432/database?sslmode=disable
      ADMIN_KAFKA_BROKERS: kafka:29092
      ADMIN_EVENTS_TOPIC: application.events
      ADMIN_CONSUMER_GROUP: admin-moderation-audit

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  kafka:
    image: apache/kafka:4.0.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic video.transcode.requested
        --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic video.transcode.completed
        --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic application.events
        --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic analytics.dlq
        --partitions 1 --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  video-worker:
    build:
      context: .
      dockerfile: services/video-worker/Dockerfile
    init: true
    stop_grace_period: 2m
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: video-worker
      KAFKA_MAX_BYTES: "10000000"
      S3_ENDPOINT: minio:9000
      S3_BUCKET: general-project
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_SECURE: "false"

  call-signaling:
    build:
      context: .
      dockerfile: services/call-signaling/Dockerfile
    init: true
    depends_on:
      pg:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:8001:8001"
    environment:
      CALL_SIGNALING_ADDR: "0.0.0.0:8001"
      CALL_ALLOWED_ORIGINS: "${CALL_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      CALL_JWT_SECRET: "${IDENTITY_JWT_SECRET:-local-identity-secret}"
      CALL_REDIS_ADDR: redis:6379
      CALL_REDIS_DB: "0"
      CALL_POSTGRES_URL: postgres://admin:password@pg:5432/database
      CALL_SESSION_TTL: 2m
      CALL_MAX_MESSAGE_BYTES: "262144"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9002:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  mailpit:
    container_name: backend_mail
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1


volumes:
  postgres_data:
  pgdata_test:
  redis_data:
  minio_data:
  clickhouse_data:
